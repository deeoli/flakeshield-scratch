[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flakeshield"
version = "0.2.0"
description = "CI signal reduction tool: detect, group, and prioritize flaky test failures using fingerprinting and semantic analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FlakeShield contributors"}
]
keywords = ["testing", "ci", "flakiness", "ml", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
flakeshield = "flakeshield.cli:main"

[tool.setuptools]
packages = ["flakeshield"]

[tool.setuptools.package-data]
flakeshield = []
