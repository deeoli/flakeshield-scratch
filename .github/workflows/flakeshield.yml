name: FlakeShield CI Signal Reduction

on:
  pull_request:
  workflow_dispatch:

jobs:
  flakeshield:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests (produce JUnit XML)
        run: |
          mkdir -p outputs
          pytest --junitxml=outputs/junit_run1.xml || true
          pytest --junitxml=outputs/junit_run2.xml || true

      - name: Prepare output directory
        run: |
          mkdir -p outputs

      - name: Restore FlakeShield DB cache
        uses: actions/cache@v4
        with:
          path: outputs/flakeshield.db
          key: flakeshield-db-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            flakeshield-db-${{ github.ref }}-

      - name: Run FlakeShield (deterministic)
        run: |
          flakeshield --reports "outputs/junit_run*.xml" \
                     --out outputs/flake_report \
                     --db outputs/flakeshield.db

      - name: Run FlakeShield (semantic, non-blocking)
        run: |
          flakeshield --reports "outputs/junit_run*.xml" \
                     --out outputs/flake_report \
                     --db outputs/flakeshield.db \
                     --enable-semantic
        continue-on-error: true

      - name: Generate PR summary
        run: |
          flakeshield pr-summary --json outputs/flake_report.json --out outputs/pr_comment.md

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('outputs/pr_comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }).catch(e => console.log('comment failed', e));

      - name: Save FlakeShield DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outputs/flakeshield.db
          key: flakeshield-db-${{ github.ref }}-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flakeshield-reports
          path: |
            outputs/flake_report.json
            outputs/flake_report.md
            outputs/flakeshield.db
            outputs/pr_comment.md
