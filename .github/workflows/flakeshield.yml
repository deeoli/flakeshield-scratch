name: FlakeShield CI Signal Reduction

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  flakeshield:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests (JUnit XML)
        run: |
          pytest --junitxml=report.xml || true

      - name: Prepare output directory
        run: |
          mkdir -p outputs

      - name: Run FlakeShield
        run: |
          python -m flakeshield.cli \
            --reports report.xml \
            --out outputs/flake_report \
            --db outputs/flakeshield.db

      - name: Upload FlakeShield reports
        uses: actions/upload-artifact@v4
        with:
          name: flakeshield-report
          path: outputs/
