name: FlakeShield Action Example

on:
  pull_request:
  workflow_dispatch:

jobs:
  flakeshield:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          mkdir -p outputs
          pytest --junitxml=outputs/junit.xml || true

      - name: Run FlakeShield
        uses: deeoli/flakeshield-scratch@v0.4.0
        with:
          reports: "outputs/junit.xml"
          enable_semantic: "true"
          warn_on_high: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flakeshield-report
          path: |
            outputs/flake_report.json
            outputs/flake_report.md
            outputs/flakeshield.db
