name: "FlakeShield CI Intelligence"
description: "Runs the FlakeShield CLI to triage JUnit reports inside a workflow."

inputs:
  reports:
    description: "Glob pattern for JUnit XML reports."
    required: true
  enable_semantic:
    description: "Enable semantic mode."
    required: false
    default: "false"
  warn_on_high:
    description: "Add --warn-on-high flag."
    required: false
    default: "false"
  fail_on_critical:
    description: "Add --fail-on-critical flag."
    required: false
    default: "false"
  max_risk_threshold:
    description: "Threshold for --max-risk-threshold."
    required: false
    default: ""
  out_prefix:
    description: "Base path for output files."
    required: false
    default: "outputs/flake_report"
  db_path:
    description: "SQLite DB path."
    required: false
    default: "outputs/flakeshield.db"

runs:
  using: docker
  image: Dockerfile
  args:
    - --reports
    - "${{ inputs.reports }}"
    - --out
    - "${{ inputs.out_prefix }}"
    - --db
    - "${{ inputs.db_path }}"
    # Boolean logic: The script receives these as the string "true" or "false"
    - --enable-semantic
    - "${{ inputs.enable_semantic }}"
    - --warn-on-high
    - "${{ inputs.warn_on_high }}"
    - --fail-on-critical
    - "${{ inputs.fail_on_critical }}"
    - --max-risk-threshold
    - "${{ inputs.max_risk_threshold }}"